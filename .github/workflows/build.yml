name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
  schedule:
    # Weekly: catch breakage from new IDE releases and EAPs.
    - cron: '0 6 * * 1'
  # The Run workflow button; tick "verify" to run the plugin verifier as well.
  workflow_dispatch:
    inputs:
      verify:
        description: Run verifyPlugin (downloads three IDEs, about 10 minutes)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew buildPlugin test

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: jingle-code
          path: build/distributions/*.zip

  # About 10 minutes, so not on every push: on pull requests into master (the gate before a release),
  # weekly against new releases and EAPs, and on demand.
  verify:
    if: >-
      ${{ (github.event_name == 'pull_request' && github.base_ref == 'master')
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.verify) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for IDE downloads
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Upload verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
