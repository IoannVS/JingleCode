name: Release

# A merge to master publishes the version from gradle.properties to JetBrains Marketplace,
# then tags it v<version> and makes a GitHub release with the zip.
# A version that already has its tag is skipped, so merges without a version bump publish nothing.
on:
  push:
    branches: [ master ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to publish."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version and changelog
        if: ${{ !steps.version.outputs.released }}
        run: |
          version='${{ steps.version.outputs.version }}'
          case "$version" in
            *SNAPSHOT*) echo "::error::Version $version is a snapshot."; exit 1 ;;
          esac
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$version] section: run ./gradlew patchChangelog before merging."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: ${{ !steps.version.outputs.released }}
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !steps.version.outputs.released }}

      - name: Test and publish
        if: ${{ !steps.version.outputs.released }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew test publishPlugin

      - name: Tag and make a GitHub release
        if: ${{ !steps.version.outputs.released }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.version.outputs.version }}'
          ./gradlew -q getChangelog --no-header --project-version="$version" > release-notes.md
          gh release create "v$version" build/distributions/*.zip \
            --target "$GITHUB_SHA" --title "$version" --notes-file release-notes.md
