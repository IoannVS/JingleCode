settings.village.style.forest_clearing=Clearing in the forest
settings.village.style.random=Random, a new one every day
settings.snow.group=Snow in the editor
settings.snow.enabled=Snow falls in the editor
settings.snow.comment=Flakes fall over the whole editor, code included; without them stars twinkle over the village. The button in the top right corner of the editor switches: a snowflake for snow, a house for stars.
