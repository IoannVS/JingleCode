settings.display.name=Jingle Code
settings.enabled=Enable Jingle Code
settings.season=Season:
settings.season.auto=Automatic (December 1 – January 14)
settings.season.always=Always
settings.season.off=Off
settings.animation=Animate decorations
settings.animation.comment=Animation pauses when the IDE window is inactive, in Power Save mode and in Presentation mode.
settings.fireplace.enabled=Fireplace in the status bar
settings.fireplace.comment=A little fireplace in the bottom right corner of the IDE window. Click it to open these settings. You can also hide it from the status bar menu.
settings.editor.group=Editor
widget.fireplace.name=Jingle Code fireplace
widget.fireplace.tooltip=Jingle Code settings
settings.garland.group=Garland and icicles
settings.garland.enabled=Garland in the gaps between panels
settings.garland.comment=Needs the Islands UI. Lights hang along the gaps between panels and over the status bar.
settings.garland.mode=Lights:
settings.garland.mode.twinkle=Twinkle
settings.garland.mode.chase=Chase
settings.garland.mode.flow=Color flow
settings.garland.mode.warm_white=Warm white
settings.garland.size=Size:
settings.garland.size.small=Small
settings.garland.size.normal=Normal
settings.garland.size.large=Large
settings.icicles.enabled=Icicles under the toolbar
settings.icicles.comment=Needs the Islands UI. Icicles hang along the top edge of the panels, their tips glint now and then. Their size follows the garland size.
settings.tabicicles.enabled=Icicles under the active editor tab
settings.tabicicles.comment=Experimental: relies on how the editor tabs are laid out. Only for tabs above the editor; the icicles hang over its top edge. Their size follows the garland size.
settings.run.reactions.enabled=React to runs and builds
settings.run.reactions.comment=When a run or a build you started ends by itself, without Stop: on success the garland fills with gold, on failure the lights blink red and icicles break off and fall to the bottom of the window, over the code too, then grow back. Any run configuration counts, tests and Debug too.
settings.fireworks.enabled=Fireworks in the toolbar on success
settings.fireworks.comment=Experimental: relies on how the main toolbar is laid out. Up to three bursts go off in the empty parts of the toolbar, between its buttons, never over the code.
settings.drift.group=Project and Commit panels
settings.drift.enabled=Snowdrift with a snowman
settings.drift.comment=Needs the Islands UI. Sits at the bottom of the Project panel, from edge to edge; with a long tree it covers the last rows. Its size follows the garland size.
settings.panel.snow.enabled=Snow falls in the Project and Commit panels
settings.panel.snow.comment=Flakes fall over the tree of files and the tree of changes, as in the editor, with the same amount and speed; while they fall, the scene with the snowman has none of its own. The button in the header of these panels, left of the ⋮ menu, goes round: a garland bulb for nothing, a snowflake for snow only, a snowflake with a snowman for both, a snowman for the scene only.
settings.village.enabled=Snowy village along the bottom of the editor
settings.village.comment=Snow along the bottom of code editors, over the line numbers too, and a village on it, over the code. The details change every day; in the evening windows and lamps are lit. Click a house to light its stove.
settings.village.style=Style:
settings.village.style.hill_farm=Farmstead on a hill
settings.village.style.valley=Valley with a ski slope
settings.village.style.uphill_street=Street up the hill
settings.village.style.forest_clearing=Clearing in the forest
settings.village.style.random=Random, a new one every day
settings.residents.enabled=Residents in the village
settings.residents.comment=Now and then one to three little scenes play: a cat, bullfinches, a dog, someone shovelling snow, carol singers, and in each style its own.
settings.residents.frequency=Scenes:
settings.residents.frequency.rare=Rarely
settings.residents.frequency.normal=Normally
settings.residents.frequency.often=Often
settings.snow.enabled=Snow falls in the editor
settings.snow.comment=Flakes fall over the whole editor, code included; without them stars twinkle over the village. The button in the top right corner of the editor goes round: a garland bulb for nothing, a snowflake for snow only, a snowflake with a house for both, a house for the village only.
settings.snow.amount=Snow:
settings.snow.amount.few=Light
settings.snow.amount.normal=Normal
settings.snow.amount.many=Heavy
settings.snow.speed=Falls:
settings.snow.speed.slow=Slowly
settings.snow.speed.normal=Normally
settings.snow.speed.fast=Fast
settings.snow.frame.rate=Smoothness:
settings.snow.frame.rate.low=Economical, {0} frames a second
settings.snow.frame.rate.medium={0} frames a second
settings.snow.frame.rate.high=Smooth, {0} frames a second
action.decor.both=Snow and the village. Click for the village only
action.decor.snow=Snow only. Click for snow and the village
action.decor.village=The village only, stars over it. Click to switch everything off
action.decor.off=No snow, no village. Click for snow
action.panel.both=Snow and the snowman. Click for the snowman only
action.panel.snow=Snow only. Click for snow and the snowman
action.panel.scene=The snowman only. Click to switch everything off
action.panel.off=No snow, no snowman. Click for snow
settings.popups.group=Popups and menus
settings.popups.enabled=Snow on popups and notifications (experimental)
settings.popups.comment=A thin snow cap on the top edge of Search Everywhere, Go to, Recent Files and other popups, outside them; a holly sprig on the corner of notifications. Relies on how the IDE shows popups. Its size follows the garland size.
settings.menus.enabled=Snow on context menus (experimental)
settings.menus.comment=The same snow cap above context menus and submenus; the menu items stay untouched.
settings.railway.group=Railway in the Bottom Tool Windows
settings.railway.enabled=Railway
settings.railway.comment=A narrow strip at the bottom of tool windows docked at the bottom (Terminal, Run, Debug, Git and others): rails, trains, people on the path. Room is made for it, so it never covers the window's text. Not shown in windows lower than 120 pixels.
settings.railway.frequency=Trains:
settings.railway.frequency.rare=Rarely
settings.railway.frequency.normal=Normally
settings.railway.frequency.often=Often
settings.railway.residents=People on the path
settings.railway.poles=Poles, wires and birds
settings.yard.group=Santa's Yard in the Right Tool Windows
settings.yard.enabled=Santa's yard
settings.yard.comment=Needs the Islands UI. A strip at the bottom of tool windows docked at the right (Gradle, Maven, Database, Notifications and others): Santa's workshop, the stable, the sleigh, a family of little snowmen and the mailbox. Like the snowdrift, it covers the window's last rows. Not shown in windows lower than 120 pixels. Its size follows the garland size.
settings.yard.snow=Snow in the right tool windows
settings.yard.snow.comment=Snow falls over the whole window and the yard, as in the editor: the same amount and speed. Without it stars hang over the yard on a dark background.
settings.yard.button=Button in the window headers (experimental)
settings.yard.button.comment=Left of the "⋮" menu of every tool window at the right; switches snow and the yard round. Relies on how the IDE builds tool window headers.
action.yard.both=Snow and Santa's yard. Click for the yard only
action.yard.yard=Santa's yard under the stars. Click to switch everything off
action.yard.off=No snow, no yard. Click for snow
action.yard.snow=Snow only. Click for snow and Santa's yard
settings.yard.reactions=React to runs and builds
settings.yard.reactions.comment=While something runs, gifts come down the chute and the elves carry them to the sleigh. On success the snowmen hop for joy and Santa rides off; on failure a gift bursts into confetti and the snowmen shiver. Off, the yard just lives its life.
settings.yard.letters=Letters from notifications
settings.yard.letters.comment=A bullfinch brings a letter to the sack with every notification. The sack is emptied once a day.
