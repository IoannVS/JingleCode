settings.display.name=Jingle Code
settings.enabled=Enable Jingle Code
settings.season=Season:
settings.season.auto=Automatic (December 1 – January 14)
settings.season.always=Always
settings.season.off=Off
settings.preset=Mode:
settings.preset.minimal=Minimal
settings.preset.normal=Normal
settings.preset.maximum=Maximum
settings.preset.custom=Custom
settings.preset.comment=Minimal: a still garland, icicles and the fireplace, no animation and no scenes. Normal: animation and every scene, but no residents. Maximum: everything on. Changing any switch below makes the mode Custom.
settings.animation=Animate
settings.animation.comment=Animation pauses in Power Save mode, in Presentation mode and while the IDE window is minimized. While the window is inactive or nobody has touched the IDE for five minutes, it goes on in slow motion.
settings.fireplace.enabled=Fireplace in the status bar
settings.fireplace.comment=Click it to open these settings. It can also be hidden from the status bar menu.
settings.size=Size:
settings.size.small=Small
settings.size.normal=Normal
settings.size.large=Large
settings.size.comment=For the garland, icicles, the snowdrift, the railway, Santa's yard and snow caps.
settings.snow=Snow:
settings.snow.amount.few=Light
settings.snow.amount.normal=Normal
settings.snow.amount.many=Heavy
settings.snow.speed.slow=Falls slowly
settings.snow.speed.normal=Falls normally
settings.snow.speed.fast=Falls fast
settings.snow.comment=Falls where it is switched on below, over the code too. The button in the top right corner of the editor and in the panel headers cycles through: a garland bulb for nothing, a snowflake for snow only, then snow with the scene, then the scene alone under the stars.
settings.scenes.group=Scenes
settings.place.editor=Editor:
settings.place.panels=Project and Commit:
settings.place.bottom=Bottom tool windows:
settings.place.right=Right tool windows:
settings.place.snow=Snow
settings.village.enabled=Village
settings.village.comment=Along the bottom of the editor, over the code. The details change every day; in the evening windows and lamps are lit. Click a house to light its stove.
settings.village.style.hill_farm=Farmstead on a hill
settings.village.style.valley=Valley with a ski slope
settings.village.style.uphill_street=Street up the hill
settings.village.style.forest_clearing=Clearing in the forest
settings.village.style.random=Random, every day
settings.residents.enabled=Residents
settings.residents.comment=Now and then little scenes play: a cat, bullfinches, a dog, carol singers, and each style has a few of its own.
settings.residents.frequency.rare=Rarely
settings.residents.frequency.normal=Normally
settings.residents.frequency.often=Often
settings.drift.enabled=Snowman
settings.drift.comment=Needs the Islands UI. A snowdrift with a snowman at the bottom of the Project panel; with a long tree it covers the last rows.
settings.railway.enabled=Railway
settings.railway.comment=A strip at the bottom of Terminal, Run, Debug, Git and other bottom windows. Not shown in windows shorter than 120 pixels.
settings.railway.frequency=Trains:
settings.railway.frequency.rare=Rarely
settings.railway.frequency.normal=Normally
settings.railway.frequency.often=Often
settings.railway.residents=People
settings.railway.poles=Poles and birds
settings.yard.enabled=Santa's yard
settings.yard.comment=Needs the Islands UI. A strip at the bottom of Gradle, Maven, Database and other right windows: the workshop, the sleigh, the snowmen, the mailbox. Not shown in windows shorter than 120 pixels.
settings.yard.reactions=Reacts to runs
settings.yard.reactions.comment=While something runs, the elves carry gifts to the sleigh. On success Santa rides off, on failure a gift bursts into confetti.
settings.yard.letters=Letters
settings.yard.letters.comment=A bullfinch brings a letter for every notification. The sack is emptied once a day.
settings.buttons=Header buttons:
settings.buttons.bottom=Bottom windows
settings.buttons.right=Right windows
settings.buttons.comment=Experimental: relies on how the IDE builds tool window headers. The button left of the "⋮" menu cycles through snow and the scene.
settings.window.group=IDE Window
settings.garland=Garland:
settings.garland.enabled=Between panels
settings.garland.comment=Needs the Islands UI. Lights hang along the gaps between panels and over the status bar.
settings.garland.mode.twinkle=Twinkle
settings.garland.mode.chase=Chase
settings.garland.mode.flow=Color flow
settings.garland.mode.warm_white=Warm white
settings.icicles=Icicles:
settings.icicles.enabled=Under the toolbar
settings.icicles.comment=Needs the Islands UI. Their tips glint now and then.
settings.tabicicles.enabled=Under the active tab
settings.tabicicles.comment=Experimental: relies on how the editor tabs are laid out. Only for tabs above the editor.
settings.caps=Snow caps:
settings.popups.enabled=On popups
settings.popups.comment=Experimental. On the top edge of Search Everywhere, Go to and other popups; a holly sprig on the corner of notifications.
settings.menus.enabled=On context menus
settings.menus.comment=Experimental. Above context menus and submenus; the items stay untouched.
settings.runs=Runs and builds:
settings.run.reactions.enabled=Garland and icicles react
settings.run.reactions.comment=When a run, test or build ends by itself, without Stop: on success the garland turns gold, on failure the lights blink red and icicles fall down the window, then grow back.
settings.fireworks.enabled=Fireworks
settings.fireworks.comment=Experimental: relies on how the main toolbar is laid out. On success up to three bursts go off between the toolbar buttons.
settings.easter=Easter eggs:
settings.easter.enabled=Enabled
settings.easter.comment=A few surprises are hidden in the IDE. Finding them is up to you.
