settings.display.name=Jingle Code
settings.enabled=Jingle Code を有効にする
settings.season=シーズン:
settings.season.auto=自動 (12月1日～1月14日)
settings.season.always=常に
settings.season.off=オフ
settings.preset=モード:
settings.preset.minimal=最小
settings.preset.normal=標準
settings.preset.maximum=最大
settings.preset.custom=カスタム
settings.preset.comment=最小: 動かないガーランド、つらら、暖炉だけで、アニメーションとシーンはありません。標準: アニメーションとすべてのシーン。ただし住人は登場しません。最大: すべてオン。下のスイッチをひとつでも変えると、モードは「カスタム」になります。
settings.animation=アニメーション
settings.animation.comment=Power Save モード、Presentation モード、IDE ウィンドウが最小化されているときは、アニメーションが一時停止します。ウィンドウが非アクティブのとき、または 5 分間 IDE が操作されていないときは、スローモーションで続きます。
settings.fireplace.enabled=ステータスバーの暖炉
settings.fireplace.comment=クリックするとこの設定が開きます。ステータスバーのメニューから非表示にすることもできます。
settings.size=サイズ:
settings.size.small=小
settings.size.normal=標準
settings.size.large=大
settings.size.comment=ガーランド、つらら、雪だまり、鉄道、サンタの庭、雪のふちに適用されます。
settings.snow=雪:
settings.snow.amount.few=少なめ
settings.snow.amount.normal=標準
settings.snow.amount.many=多め
settings.snow.speed.slow=ゆっくり降る
settings.snow.speed.normal=普通に降る
settings.snow.speed.fast=速く降る
settings.snow.comment=下でオンにした場所に、コードの上にも降ります。エディターの右上隅とパネルのヘッダーにあるボタンで順に切り替えます: ガーランドの電球は何もなし、雪の結晶は雪のみ、次に雪とシーン、最後に星空の下のシーンのみ。
settings.scenes.group=シーン
settings.place.editor=エディター:
settings.place.panels=Project と Commit:
settings.place.bottom=下部のツールウィンドウ:
settings.place.right=右側のツールウィンドウ:
settings.place.snow=雪
settings.village.enabled=村
settings.village.comment=エディターの下端に沿って、コードの上に表示されます。細部は毎日変わり、夕方には窓と街灯に明かりがともります。家をクリックするとストーブに火が入ります。
settings.village.style.hill_farm=丘の上の農家
settings.village.style.valley=スキー場のある谷
settings.village.style.uphill_street=坂道の通り
settings.village.style.forest_clearing=森の空き地
settings.village.style.random=毎日ランダム
settings.residents.enabled=住人
settings.residents.comment=ときどき小さなシーンが繰り広げられます: 猫、小鳥のウソ、犬、キャロルを歌う人たち。スタイルごとに独自のシーンもあります。
settings.residents.frequency.rare=まれに
settings.residents.frequency.normal=普通
settings.residents.frequency.often=頻繁に
settings.drift.enabled=雪だるま
settings.drift.comment=Islands UI が必要です。Project パネルの下部に雪だまりと雪だるまが現れます。ツリーが長いと最後の数行が隠れます。
settings.railway.enabled=鉄道
settings.railway.comment=Terminal、Run、Debug、Git などの下部ウィンドウの下端に表示される帯です。高さが 120 ピクセル未満のウィンドウには表示されません。
settings.railway.frequency=列車:
settings.railway.frequency.rare=まれに
settings.railway.frequency.normal=普通
settings.railway.frequency.often=頻繁に
settings.railway.residents=人々
settings.railway.poles=電柱と鳥
settings.yard.enabled=サンタの庭
settings.yard.comment=Islands UI が必要です。Gradle、Maven、Database などの右側ウィンドウの下端に表示される帯です: 工房、そり、雪だるま、郵便受け。高さが 120 ピクセル未満のウィンドウには表示されません。
settings.yard.reactions=実行に反応する
settings.yard.reactions.comment=何かが実行されているあいだ、エルフたちがプレゼントをそりに運びます。成功するとサンタが出発し、失敗するとプレゼントがはじけて紙吹雪になります。
settings.yard.letters=手紙
settings.yard.letters.comment=通知が来るたびに、小鳥のウソが手紙を届けます。袋は1日に1回空になります。
settings.buttons=ヘッダーのボタン:
settings.buttons.bottom=下部のウィンドウ
settings.buttons.right=右側のウィンドウ
settings.buttons.comment=実験的: IDE がツールウィンドウのヘッダーを組み立てる方法に依存します。「⋮」メニューの左にあるボタンで、雪とシーンを順に切り替えます。
settings.window.group=IDE ウィンドウ
settings.garland=ガーランド:
settings.garland.enabled=パネルの間
settings.garland.comment=Islands UI が必要です。パネルの間のすき間とステータスバーの上にライトが連なります。
settings.garland.mode.twinkle=きらめき
settings.garland.mode.chase=追いかけ
settings.garland.mode.flow=カラーフロー
settings.garland.mode.warm_white=暖かい白
settings.icicles=つらら:
settings.icicles.enabled=ツールバーの下
settings.icicles.comment=Islands UI が必要です。先端がときどききらりと光ります。
settings.tabicicles.enabled=アクティブなタブの下
settings.tabicicles.comment=実験的: エディタータブのレイアウト方法に依存します。エディターの上にあるタブのみが対象です。
settings.caps=雪のふち:
settings.popups.enabled=ポップアップ
settings.popups.comment=実験的。Search Everywhere、Go to などのポップアップの上端に積もります。通知の角にはヒイラギの小枝が付きます。
settings.menus.enabled=コンテキストメニュー
settings.menus.comment=実験的。コンテキストメニューとサブメニューの上に積もります。メニュー項目はそのままです。
settings.runs=実行とビルド:
settings.run.reactions.enabled=ガーランドとつららが反応する
settings.run.reactions.comment=実行、テスト、ビルドが Stop を使わずに自然に終了したとき: 成功するとガーランドが金色になり、失敗するとライトが赤く点滅し、つららがウィンドウを落ちてから再び伸びます。
settings.fireworks.enabled=花火
settings.fireworks.comment=実験的: メインツールバーのレイアウト方法に依存します。成功すると、ツールバーのボタンの間で最大3発の花火が上がります。
settings.easter=イースターエッグ:
settings.easter.enabled=有効
settings.easter.comment=IDE にはいくつかのサプライズが隠されています。見つけるのはあなた次第です。
widget.fireplace.name=Jingle Code の暖炉
widget.fireplace.tooltip=Jingle Code の設定
action.decor.both=雪と村。クリックすると村のみ
action.decor.snow=雪のみ。クリックすると雪と村
action.decor.village=村のみ、上には星。クリックするとすべてオフ
action.decor.off=雪も村もなし。クリックすると雪が降ります
action.panel.both=雪と雪だるま。クリックすると雪だるまのみ
action.panel.snow=雪のみ。クリックすると雪と雪だるま
action.panel.scene=雪だるまのみ。クリックするとすべてオフ
action.panel.off=雪も雪だるまもなし。クリックすると雪が降ります
action.railway.both=雪と鉄道。クリックすると鉄道のみ
action.railway.railway=雪のない鉄道。クリックするとすべてオフ
action.railway.off=雪も鉄道もなし。クリックすると雪が降ります
action.railway.snow=雪のみ。クリックすると雪と鉄道
action.yard.both=雪とサンタの庭。クリックすると庭のみ
action.yard.yard=星空の下のサンタの庭。クリックするとすべてオフ
action.yard.off=雪も庭もなし。クリックすると雪が降ります
action.yard.snow=雪のみ。クリックすると雪とサンタの庭
action.JingleCode.ToggleEditorSnow.text=エディターの雪と村を切り替え
action.JingleCode.TogglePanelSnow.text=Project と Commit の雪と雪だるまを切り替え
action.JingleCode.ToggleYardDecor.text=雪とサンタの庭を切り替え
action.JingleCode.ToggleRailwayDecor.text=雪と鉄道を切り替え
