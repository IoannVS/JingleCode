action.JingleCode.TogglePanelSnow.text=Project 및 Commit의 눈과 눈사람 전환
action.JingleCode.ToggleYardDecor.text=눈과 산타의 마당 전환
action.JingleCode.ToggleRailwayDecor.text=눈과 철도 전환
