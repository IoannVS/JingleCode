settings.display.name=Jingle Code
settings.enabled=Jingle Code 사용
settings.season=시즌:
settings.season.auto=자동(12월 1일~1월 14일)
settings.season.always=항상
settings.season.off=사용 안 함
settings.preset=모드:
settings.preset.minimal=최소
settings.preset.normal=보통
settings.preset.maximum=최대
settings.preset.custom=사용자 지정
settings.preset.comment=최소: 움직이지 않는 가랜드, 고드름, 벽난로만 있고 애니메이션과 장면은 없습니다. 보통: 애니메이션과 모든 장면, 단 주민은 없습니다. 최대: 모두 켜기. 아래 스위치를 하나라도 바꾸면 모드가 “사용자 지정”이 됩니다.
settings.animation=애니메이션
settings.animation.comment=Power Save 모드, Presentation 모드, IDE 창이 최소화된 동안에는 애니메이션이 일시 정지됩니다. 창이 비활성 상태이거나 5분 동안 IDE를 조작하지 않으면 느리게 계속됩니다.
settings.fireplace.enabled=상태 표시줄의 벽난로
settings.fireplace.comment=클릭하면 이 설정이 열립니다. 상태 표시줄 메뉴에서 숨길 수도 있습니다.
settings.size=크기:
settings.size.small=작게
settings.size.normal=보통
settings.size.large=크게
settings.size.comment=가랜드, 고드름, 눈더미, 철도, 산타의 마당, 눈 쌓인 가장자리에 적용됩니다.
settings.snow=눈:
settings.snow.amount.few=적게
settings.snow.amount.normal=보통
settings.snow.amount.many=많이
settings.snow.speed.slow=천천히 내림
settings.snow.speed.normal=보통 속도로 내림
settings.snow.speed.fast=빠르게 내림
settings.snow.comment=아래에서 켠 곳에 내리며, 코드 위에도 내립니다. 에디터 오른쪽 위 모서리와 패널 헤더의 버튼으로 순서대로 전환합니다: 가랜드 전구는 모두 끔, 눈송이는 눈만, 다음은 눈과 장면, 마지막은 별빛 아래 장면만.
settings.scenes.group=장면
settings.place.editor=에디터:
settings.place.panels=Project 및 Commit:
settings.place.bottom=하단 도구 창:
settings.place.right=오른쪽 도구 창:
settings.place.snow=눈
settings.village.enabled=마을
settings.village.comment=에디터 아래쪽 가장자리를 따라 코드 위에 표시됩니다. 세부 모습은 매일 바뀌고, 저녁에는 창문과 가로등에 불이 켜집니다. 집을 클릭하면 난로에 불을 지핍니다.
settings.village.style.hill_farm=언덕 위의 농가
settings.village.style.valley=스키장이 있는 골짜기
settings.village.style.uphill_street=언덕길 거리
settings.village.style.forest_clearing=숲속 빈터
settings.village.style.random=매일 무작위
settings.residents.enabled=주민
settings.residents.comment=가끔 작은 장면이 펼쳐집니다: 고양이, 멋쟁이새, 개, 캐럴을 부르는 사람들. 스타일마다 고유한 장면도 있습니다.
settings.residents.frequency.rare=드물게
settings.residents.frequency.normal=보통
settings.residents.frequency.often=자주
settings.drift.enabled=눈사람
settings.drift.comment=Islands UI가 필요합니다. Project 패널 아래쪽의 눈더미와 눈사람입니다. 트리가 길면 마지막 몇 줄을 가립니다.
settings.railway.enabled=철도
settings.railway.comment=Terminal, Run, Debug, Git 등 하단 창의 아래쪽에 표시되는 띠입니다. 높이가 120픽셀 미만인 창에는 표시되지 않습니다.
settings.railway.frequency=기차:
settings.railway.frequency.rare=드물게
settings.railway.frequency.normal=보통
settings.railway.frequency.often=자주
settings.railway.residents=사람들
settings.railway.poles=전봇대와 새
settings.yard.enabled=산타의 마당
settings.yard.comment=Islands UI가 필요합니다. Gradle, Maven, Database 등 오른쪽 창의 아래쪽에 표시되는 띠입니다: 작업장, 썰매, 눈사람, 우편함. 높이가 120픽셀 미만인 창에는 표시되지 않습니다.
settings.yard.reactions=실행에 반응
settings.yard.reactions.comment=무언가 실행되는 동안 요정들이 선물을 썰매로 나릅니다. 성공하면 산타가 썰매를 타고 떠나고, 실패하면 선물 하나가 색종이 조각으로 터집니다.
settings.yard.letters=편지
settings.yard.letters.comment=알림이 올 때마다 멋쟁이새가 편지를 가져옵니다. 자루는 하루에 한 번 비워집니다.
settings.buttons=헤더 버튼:
settings.buttons.bottom=하단 창
settings.buttons.right=오른쪽 창
settings.buttons.comment=실험적 기능: IDE가 도구 창 헤더를 구성하는 방식에 의존합니다. “⋮” 메뉴 왼쪽의 버튼으로 눈과 장면을 순서대로 전환합니다.
settings.window.group=IDE 창
settings.garland=가랜드:
settings.garland.enabled=패널 사이
settings.garland.comment=Islands UI가 필요합니다. 패널 사이의 틈과 상태 표시줄 위에 전구가 걸립니다.
settings.garland.mode.twinkle=반짝임
settings.garland.mode.chase=따라 흐르기
settings.garland.mode.flow=색 흐름
settings.garland.mode.warm_white=따뜻한 흰색
settings.icicles=고드름:
settings.icicles.enabled=도구 모음 아래
settings.icicles.comment=Islands UI가 필요합니다. 끝이 가끔 반짝입니다.
settings.tabicicles.enabled=활성 탭 아래
settings.tabicicles.comment=실험적 기능: 에디터 탭의 배치 방식에 의존합니다. 에디터 위에 있는 탭에만 적용됩니다.
settings.caps=눈 쌓인 가장자리:
settings.popups.enabled=팝업
settings.popups.comment=실험적 기능. Search Everywhere, Go to 등 팝업의 위쪽 가장자리에 쌓이며, 알림 모서리에는 호랑가시나무 가지가 달립니다.
settings.menus.enabled=컨텍스트 메뉴
settings.menus.comment=실험적 기능. 컨텍스트 메뉴와 하위 메뉴 위에 쌓이며, 메뉴 항목은 건드리지 않습니다.
settings.runs=실행 및 빌드:
settings.run.reactions.enabled=가랜드와 고드름이 반응
settings.run.reactions.comment=실행, 테스트, 빌드가 Stop 없이 스스로 끝나면: 성공 시 가랜드가 금색으로 바뀌고, 실패 시 전구가 빨갛게 깜박이며 고드름이 창을 따라 떨어졌다가 다시 자랍니다.
settings.fireworks.enabled=불꽃놀이
settings.fireworks.comment=실험적 기능: 기본 도구 모음의 배치 방식에 의존합니다. 성공하면 도구 모음 버튼 사이에서 불꽃이 최대 세 번 터집니다.
widget.fireplace.name=Jingle Code 벽난로
widget.fireplace.tooltip=Jingle Code 설정
action.decor.both=눈과 마을. 클릭하면 마을만
action.decor.snow=눈만. 클릭하면 눈과 마을
action.decor.village=마을만, 위에는 별. 클릭하면 모두 끔
action.decor.off=눈도 마을도 없음. 클릭하면 눈이 내립니다
action.panel.both=눈과 눈사람. 클릭하면 눈사람만
action.panel.snow=눈만. 클릭하면 눈과 눈사람
action.panel.scene=눈사람만. 클릭하면 모두 끔
action.panel.off=눈도 눈사람도 없음. 클릭하면 눈이 내립니다
action.railway.both=눈과 철도. 클릭하면 철도만
action.railway.railway=눈 없는 철도. 클릭하면 모두 끔
action.railway.off=눈도 철도도 없음. 클릭하면 눈이 내립니다
action.railway.snow=눈만. 클릭하면 눈과 철도
action.yard.both=눈과 산타의 마당. 클릭하면 마당만
action.yard.yard=별빛 아래 산타의 마당. 클릭하면 모두 끔
action.yard.off=눈도 마당도 없음. 클릭하면 눈이 내립니다
action.yard.snow=눈만. 클릭하면 눈과 산타의 마당
