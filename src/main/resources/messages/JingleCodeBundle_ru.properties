action.decor.snow=Только снег. Нажмите — снег и деревня
action.decor.village=Только деревня, над ней звёзды. Нажмите — выключить всё
action.decor.off=Ни снега, ни деревни. Нажмите — пойдёт снег
action.panel.both=Снег и снеговик. Нажмите — только снеговик
action.panel.snow=Только снег. Нажмите — снег и снеговик
action.panel.scene=Только снеговик. Нажмите — выключить всё
action.panel.off=Ни снега, ни снеговика. Нажмите — пойдёт снег
action.railway.both=Снег и железная дорога. Нажмите — только дорога
action.railway.railway=Железная дорога без снега. Нажмите — выключить всё
action.railway.off=Ни снега, ни дороги. Нажмите — пойдёт снег
action.railway.snow=Только снег. Нажмите — снег и железная дорога
action.yard.both=Снег и двор Санты. Нажмите — только двор
action.yard.yard=Двор Санты под звёздами. Нажмите — выключить всё
action.yard.off=Ни снега, ни двора. Нажмите — пойдёт снег
action.yard.snow=Только снег. Нажмите — снег и двор Санты
