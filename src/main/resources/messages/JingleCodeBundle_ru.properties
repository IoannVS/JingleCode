settings.display.name=Jingle Code
settings.enabled=Включить Jingle Code
settings.season=Сезон:
settings.season.auto=Автоматически (1 декабря – 14 января)
settings.season.always=Всегда
settings.season.off=Никогда
settings.preset=Режим:
settings.preset.minimal=Минимальный
settings.preset.normal=Обычный
settings.preset.maximum=Максимальный
settings.preset.custom=Свой
settings.preset.comment=Минимальный: неподвижные гирлянда, сосульки и камин, без анимации и сцен. Обычный: анимация и все сцены, но без сценок из жизни. Максимальный: включено всё. Любое изменение переключателей ниже переводит режим в «Свой».
settings.animation=Анимация
settings.animation.comment=Анимация встаёт на паузу в Power Save, в Presentation mode и когда окно IDE свёрнуто. Когда окно не в фокусе или к IDE никто не прикасался пять минут, она идёт медленно.
settings.fireplace.enabled=Камин в строке состояния
settings.fireplace.comment=Щёлкните по нему, чтобы открыть эти настройки. Скрыть его можно через меню строки состояния.
settings.size=Размер:
settings.size.small=Мелкий
settings.size.normal=Обычный
settings.size.large=Крупный
settings.size.comment=Для гирлянды, сосулек, сугроба, железной дороги, двора Санты и снежных кромок.
settings.snow=Снег:
settings.snow.amount.few=Редкий
settings.snow.amount.normal=Обычный
settings.snow.amount.many=Густой
settings.snow.speed.slow=Падает медленно
settings.snow.speed.normal=Падает обычно
settings.snow.speed.fast=Падает быстро
settings.snow.comment=Идёт там, где включён ниже, в том числе поверх кода. Кнопка в правом верхнем углу редактора и в заголовках панелей переключает по кругу: лампочка гирлянды — ничего, снежинка — только снег, потом снег со сценой, потом одна сцена под звёздами.
settings.scenes.group=Сцены
settings.place.editor=Редактор:
settings.place.panels=Project и Commit:
settings.place.bottom=Нижние окна:
settings.place.right=Правые окна:
settings.place.snow=Снег
settings.village.enabled=Деревня
settings.village.comment=Вдоль нижнего края редактора, поверх кода. Детали меняются каждый день; вечером горят окна и фонари. Щёлкните по дому, чтобы затопить печь.
settings.village.style.hill_farm=Хутор на холме
settings.village.style.valley=Долина с горнолыжкой
settings.village.style.uphill_street=Улица в гору
settings.village.style.forest_clearing=Поляна в лесу
settings.village.style.random=Каждый день новая
settings.residents.enabled=Жители
settings.residents.comment=Время от времени разыгрываются сценки: кот, снегири, собака, колядующие, а в каждом стиле ещё и свои.
settings.residents.frequency.rare=Редко
settings.residents.frequency.normal=Обычно
settings.residents.frequency.often=Часто
settings.drift.enabled=Снеговик
settings.drift.comment=Нужен интерфейс Islands. Сугроб со снеговиком внизу панели Project; при длинном дереве закрывает нижние строки.
settings.railway.enabled=Железная дорога
settings.railway.comment=Полоса внизу Terminal, Run, Debug, Git и других нижних окон. В окнах высотой меньше 120 пикселей не показывается.
settings.railway.frequency=Поезда:
settings.railway.frequency.rare=Редко
settings.railway.frequency.normal=Обычно
settings.railway.frequency.often=Часто
settings.railway.residents=Жители
settings.railway.poles=Столбы и птицы
settings.yard.enabled=Двор Санты
settings.yard.comment=Нужен интерфейс Islands. Полоса внизу Gradle, Maven, Database и других правых окон: мастерская, сани, снеговики, почта. В окнах высотой меньше 120 пикселей не показывается.
settings.yard.reactions=Реагирует на запуски
settings.yard.reactions.comment=Пока что-то запущено, гномы носят подарки в сани. При успехе Санта уезжает, при ошибке подарок разлетается конфетти.
settings.yard.letters=Письма
settings.yard.letters.comment=С каждым уведомлением снегирь приносит письмо. Мешок пустеет раз в день.
settings.buttons=Кнопки в заголовках:
settings.buttons.bottom=Нижние окна
settings.buttons.right=Правые окна
settings.buttons.comment=Экспериментально: зависит от того, как IDE собирает заголовок окна. Кнопка слева от меню «⋮» переключает снег и сцену по кругу.
settings.window.group=Окно IDE
settings.garland=Гирлянда:
settings.garland.enabled=Между панелями
settings.garland.comment=Нужен интерфейс Islands. Огни висят вдоль щелей между панелями и над строкой состояния.
settings.garland.mode.twinkle=Мерцание
settings.garland.mode.chase=Бегущий огонь
settings.garland.mode.flow=Перелив
settings.garland.mode.warm_white=Тёплый белый
settings.icicles=Сосульки:
settings.icicles.enabled=Под тулбаром
settings.icicles.comment=Нужен интерфейс Islands. Их кончики иногда поблёскивают.
settings.tabicicles.enabled=Под активной вкладкой
settings.tabicicles.comment=Экспериментально: зависит от того, как устроены вкладки редактора. Только для вкладок над редактором.
settings.caps=Снежные кромки:
settings.popups.enabled=На всплывающих окнах
settings.popups.comment=Экспериментально. По верхнему краю Search Everywhere, Go to и других всплывающих окон; на углу уведомлений веточка остролиста.
settings.menus.enabled=На контекстных меню
settings.menus.comment=Экспериментально. Над контекстными меню и подменю; пункты меню не трогаем.
settings.runs=Запуски и сборка:
settings.run.reactions.enabled=Гирлянда и сосульки реагируют
settings.run.reactions.comment=Когда запуск, тесты или сборка завершились сами, без Stop: при успехе гирлянда золотеет, при ошибке огни мигают красным, а сосульки падают по окну и отрастают снова.
settings.fireworks.enabled=Салют
settings.fireworks.comment=Экспериментально: зависит от того, как устроен главный тулбар. При успехе до трёх залпов между кнопками тулбара.
widget.fireplace.name=Камин Jingle Code
widget.fireplace.tooltip=Настройки Jingle Code
