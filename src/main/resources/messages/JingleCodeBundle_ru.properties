settings.display.name=Jingle Code
settings.enabled=Включить Jingle Code
settings.season=Сезон:
settings.season.auto=Автоматически (1 декабря – 14 января)
settings.season.always=Всегда
settings.season.off=Выключено
settings.animation=Анимировать украшения
settings.animation.comment=Анимация встаёт на паузу, когда окно IDE не в фокусе, в Power Save и в Presentation mode.
settings.fireplace.enabled=Камин в строке состояния
settings.fireplace.comment=Маленький камин в правом нижнем углу окна IDE. Щёлкните по нему, чтобы открыть эти настройки. Скрыть его можно и через меню строки состояния.
settings.editor.group=Редактор
widget.fireplace.name=Камин Jingle Code
widget.fireplace.tooltip=Настройки Jingle Code
settings.garland.group=Гирлянда и сосульки
settings.garland.enabled=Гирлянда в щелях между панелями
settings.garland.comment=Нужен интерфейс Islands. Огни висят вдоль щелей между панелями и над строкой состояния.
settings.garland.mode=Огни:
settings.garland.mode.twinkle=Мерцание
settings.garland.mode.chase=Бегущий огонь
settings.garland.mode.flow=Перелив
settings.garland.mode.warm_white=Тёплый белый
settings.garland.size=Размер:
settings.garland.size.small=Мелкая
settings.garland.size.normal=Обычная
settings.garland.size.large=Крупная
settings.icicles.enabled=Сосульки под тулбаром
settings.icicles.comment=Нужен интерфейс Islands. Сосульки висят вдоль верхнего края панелей, их кончики иногда поблёскивают. Размер как у гирлянды.
settings.tabicicles.enabled=Сосульки под активной вкладкой редактора
settings.tabicicles.comment=Экспериментально: зависит от того, как устроены вкладки редактора. Только для вкладок над редактором; сосульки свисают на его верхний край. Размер как у гирлянды.
settings.run.reactions.enabled=Реагировать на запуски и сборку
settings.run.reactions.comment=Когда запуск или сборка завершились сами, без Stop: при успехе гирлянда заливается золотом, при ошибке огни мигают красным, а сосульки срываются и падают до низа окна, в том числе поверх кода, и отрастают снова. Считается любая Run-конфигурация, тесты и Debug тоже.
settings.fireworks.enabled=Салют в тулбаре при успехе
settings.fireworks.comment=Экспериментально: зависит от того, как устроен главный тулбар. До трёх залпов в пустых местах тулбара, между кнопками, никогда поверх кода.
settings.drift.group=Панели Project и Commit
settings.drift.enabled=Сугроб со снеговиком
settings.drift.comment=Нужен интерфейс Islands. Стоит внизу панели Project от края до края; при длинном дереве закрывает нижние строки. Размер как у гирлянды.
settings.panel.snow.enabled=Снег падает в панелях Project и Commit
settings.panel.snow.comment=Снежинки летят над деревом файлов и деревом изменений, как в редакторе, столько же и с той же скоростью; пока они идут, у сцены со снеговиком своих снежинок нет. Кнопка в заголовке этих панелей, слева от меню «⋮», переключает по кругу: лампочка гирлянды — ничего, снежинка — только снег, снежинка со снеговиком — снег и снеговик, снеговик — только сцена.
settings.village.enabled=Заснеженная деревня внизу редактора
settings.village.comment=Сугроб вдоль нижнего края редакторов кода, в том числе поверх номеров строк, и деревня на нём, поверх кода. Детали меняются каждый день; вечером горят окна и фонари. Щёлкните по дому, чтобы затопить печь.
settings.village.style=Стиль:
settings.village.style.hill_farm=Хутор на холме
settings.village.style.valley=Долина с горнолыжкой
settings.village.style.uphill_street=Улица в гору
settings.village.style.forest_clearing=Поляна в лесу
settings.village.style.random=Случайный, каждый день новый
settings.residents.enabled=Жители в деревне
settings.residents.comment=Время от времени разыгрываются одна–три сценки: кот, снегири, собака, кто-то чистит снег, колядующие, а в каждом стиле ещё и свои.
settings.residents.frequency=Сценки:
settings.residents.frequency.rare=Редко
settings.residents.frequency.normal=Обычно
settings.residents.frequency.often=Часто
settings.snow.enabled=Снег падает в редакторе
settings.snow.comment=Снежинки летят по всему редактору, поверх кода; без них над деревней мерцают звёзды. Кнопка в правом верхнем углу редактора переключает по кругу: лампочка гирлянды — ничего, снежинка — только снег, снежинка с домиком — снег и деревня, домик — только деревня.
settings.snow.amount=Снег:
settings.snow.amount.few=Редкий
settings.snow.amount.normal=Обычный
settings.snow.amount.many=Густой
settings.snow.speed=Падает:
settings.snow.speed.slow=Медленно
settings.snow.speed.normal=Обычно
settings.snow.speed.fast=Быстро
settings.snow.frame.rate=Плавность:
settings.snow.frame.rate.low=Экономно, {0} кадров в секунду
settings.snow.frame.rate.medium={0} кадров в секунду
settings.snow.frame.rate.high=Плавно, {0} кадров в секунду
action.decor.both=Снег и деревня. Нажмите — только деревня
action.decor.snow=Только снег. Нажмите — снег и деревня
action.decor.village=Только деревня, над ней звёзды. Нажмите — выключить всё
action.decor.off=Ни снега, ни деревни. Нажмите — пойдёт снег
action.panel.both=Снег и снеговик. Нажмите — только снеговик
action.panel.snow=Только снег. Нажмите — снег и снеговик
action.panel.scene=Только снеговик. Нажмите — выключить всё
action.panel.off=Ни снега, ни снеговика. Нажмите — пойдёт снег
settings.popups.group=Всплывающие окна и меню
settings.popups.enabled=Снег на всплывающих окнах и уведомлениях (эксп.)
settings.popups.comment=Тонкая снежная кромка на верхнем крае Search Everywhere, Go to, Recent Files и других всплывающих окон, снаружи; на углу уведомлений веточка остролиста. Зависит от того, как IDE показывает всплывающие окна. Размер как у гирлянды.
settings.menus.enabled=Снег на контекстных меню (эксп.)
settings.menus.comment=Такая же кромка над контекстными меню и подменю, пункты меню не трогаем.
settings.railway.group=Железная дорога в нижних окнах
settings.railway.enabled=Железная дорога
settings.railway.comment=Узкая полоса внизу окон, пристыкованных снизу (Terminal, Run, Debug, Git и других): рельсы, поезда, жители на дорожке. Под нижнюю половину оставляется место, верх столбов, провода и птицы лежат поверх нижних строк окна. В окнах ниже 120 пикселей не показывается. Размер как у гирлянды.
settings.railway.frequency=Поезда:
settings.railway.frequency.rare=Редко
settings.railway.frequency.normal=Обычно
settings.railway.frequency.often=Часто
settings.railway.residents=Жители на дорожке
settings.railway.poles=Столбы с проводами и птицы
settings.railway.snow=Снег в нижних окнах
settings.railway.snow.comment=Снег идёт по всему окну и над железной дорогой, как в редакторе: то же количество и скорость. Нужен интерфейс Islands.
settings.railway.button=Кнопка в заголовках окон (эксп.)
settings.railway.button.comment=Слева от меню «⋮» каждого окна снизу, переключает снег и железную дорогу по кругу. Зависит от того, как IDE собирает заголовок окна.
action.railway.both=Снег и железная дорога. Нажмите — только дорога
action.railway.railway=Железная дорога без снега. Нажмите — выключить всё
action.railway.off=Ни снега, ни дороги. Нажмите — пойдёт снег
action.railway.snow=Только снег. Нажмите — снег и железная дорога
settings.yard.group=Двор Санты в правых окнах
settings.yard.enabled=Двор Санты
settings.yard.comment=Нужен интерфейс Islands. Полоса внизу окон, пристыкованных справа (Gradle, Maven, Database, Notifications и других): мастерская Санты, конюшня, сани, семейство снеговиков и почта. Как и сугроб, закрывает нижние строки окна. В окнах ниже 120 пикселей не показывается. Размер как у гирлянды.
settings.yard.snow=Снег в правых окнах
settings.yard.snow.comment=Снег идёт по всему окну и над двором, как в редакторе: то же количество и скорость. Без него на тёмном фоне над двором висят звёзды.
settings.yard.button=Кнопка в заголовках окон (эксп.)
settings.yard.button.comment=Слева от меню «⋮» каждого окна справа, переключает снег и двор по кругу. Зависит от того, как IDE собирает заголовок окна.
action.yard.both=Снег и двор Санты. Нажмите — только двор
action.yard.yard=Двор Санты под звёздами. Нажмите — выключить всё
action.yard.off=Ни снега, ни двора. Нажмите — пойдёт снег
action.yard.snow=Только снег. Нажмите — снег и двор Санты
settings.yard.reactions=Реагировать на запуски и сборку
settings.yard.reactions.comment=Пока что-то запущено, подарки едут по жёлобу, гномы носят их в сани. При успехе снеговики подпрыгивают от радости и Санта уезжает, при ошибке подарок лопается конфетти и снеговики дрожат. Без реакций двор просто живёт своей жизнью.
settings.yard.letters=Письма от уведомлений
settings.yard.letters.comment=С каждым уведомлением снегирь приносит письмо в мешок. Мешок пустеет раз в день.
