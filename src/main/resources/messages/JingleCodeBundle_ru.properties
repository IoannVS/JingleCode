settings.garland.enabled=Гирлянда в щелях между панелями
settings.garland.comment=Нужен интерфейс Islands. Огни висят вдоль щелей между панелями и над строкой состояния.
settings.garland.mode=Огни:
settings.garland.mode.twinkle=Мерцание
settings.garland.mode.chase=Бегущий огонь
settings.garland.mode.flow=Перелив
settings.garland.mode.warm_white=Тёплый белый
settings.garland.size=Размер:
settings.garland.size.small=Мелкая
settings.garland.size.normal=Обычная
settings.garland.size.large=Крупная
settings.icicles.group=Сосульки
settings.icicles.enabled=Сосульки под тулбаром
settings.icicles.comment=Нужен интерфейс Islands. Сосульки висят вдоль верхнего края панелей, их кончики иногда поблёскивают. Размер как у гирлянды.
settings.tabicicles.group=Вкладки редактора
settings.tabicicles.enabled=Сосульки под активной вкладкой редактора
settings.tabicicles.comment=Экспериментально: зависит от того, как устроены вкладки редактора. Только для вкладок над редактором; сосульки свисают на его верхний край. Размер как у гирлянды.
settings.drift.group=Панель Project
settings.drift.enabled=Сугроб со снеговиком
settings.drift.comment=Нужен интерфейс Islands. Стоит внизу панели Project от края до края; при длинном дереве закрывает нижние строки. Размер как у гирлянды.
settings.village.group=Деревня
settings.village.enabled=Заснеженная деревня внизу редактора
settings.village.comment=Сугроб вдоль нижнего края редакторов кода, в том числе поверх номеров строк, и деревня на нём, поверх кода. Детали меняются каждый день; вечером горят окна и фонари. Щёлкните по дому, чтобы затопить печь.
settings.village.style=Стиль:
settings.village.style.hill_farm=Хутор на холме
settings.village.style.valley=Долина с горнолыжкой
settings.village.style.uphill_street=Улица в гору
settings.village.style.forest_clearing=Поляна в лесу
settings.village.style.random=Случайный, каждый день новый
settings.residents.enabled=Жители в деревне
settings.residents.comment=Время от времени разыгрываются одна–три сценки: кот, снегири, собака, кто-то чистит снег, колядующие, а в каждом стиле ещё и свои.
settings.residents.frequency=Сценки:
settings.residents.frequency.rare=Редко
settings.residents.frequency.normal=Обычно
settings.residents.frequency.often=Часто
settings.snow.group=Снег в редакторе
settings.snow.enabled=Снег падает в редакторе
settings.snow.comment=Снежинки летят по всему редактору, поверх кода; без них над деревней мерцают звёзды. Кнопка в правом верхнем углу редактора переключает по кругу: лампочка гирлянды — ничего, снежинка — только снег, снежинка с домиком — снег и деревня, домик — только деревня.
settings.snow.amount=Снег:
settings.snow.amount.few=Редкий
settings.snow.amount.normal=Обычный
settings.snow.amount.many=Густой
settings.snow.speed=Падает:
settings.snow.speed.slow=Медленно
settings.snow.speed.normal=Обычно
settings.snow.speed.fast=Быстро
settings.snow.frame.rate=Плавность:
settings.snow.frame.rate.low=Экономно, {0} кадров в секунду
settings.snow.frame.rate.medium={0} кадров в секунду
settings.snow.frame.rate.high=Плавно, {0} кадров в секунду
action.decor.both=Снег и деревня. Нажмите — только деревня
action.decor.snow=Только снег. Нажмите — снег и деревня
action.decor.village=Только деревня, над ней звёзды. Нажмите — выключить всё
action.decor.off=Ни снега, ни деревни. Нажмите — пойдёт снег
settings.popups.group=Всплывающие окна и меню
settings.popups.enabled=Снег на всплывающих окнах и уведомлениях (эксп.)
settings.popups.comment=Тонкая снежная кромка на верхнем крае Search Everywhere, Go to, Recent Files и других всплывающих окон, снаружи; на углу уведомлений веточка остролиста. Зависит от того, как IDE показывает всплывающие окна. Размер как у гирлянды.
settings.menus.enabled=Снег на контекстных меню (эксп.)
settings.menus.comment=Такая же кромка над контекстными меню и подменю, пункты меню не трогаем.
