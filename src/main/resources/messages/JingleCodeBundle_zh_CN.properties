settings.display.name=Jingle Code
settings.enabled=启用 Jingle Code
settings.season=季节：
settings.season.auto=自动（12 月 1 日至 1 月 14 日）
settings.season.always=始终
settings.season.off=从不
settings.preset=模式：
settings.preset.minimal=极简
settings.preset.normal=标准
settings.preset.maximum=全部
settings.preset.custom=自定义
settings.preset.comment=极简：静止的彩灯、冰柱和壁炉，没有动画和场景。标准：动画和所有场景，但没有居民。全部：全部开启。改动下方任意开关，模式即变为“自定义”。
settings.animation=动画
settings.animation.comment=IDE 窗口处于非活动状态、Power Save 模式和 Presentation 模式下，动画会暂停。
settings.fireplace.enabled=状态栏中的壁炉
settings.fireplace.comment=点击它可打开此设置。也可以通过状态栏菜单隐藏它。
settings.size=尺寸：
settings.size.small=小
settings.size.normal=中
settings.size.large=大
settings.size.comment=适用于彩灯、冰柱、雪堆、铁路、圣诞老人的院子和积雪边缘。
settings.snow=雪：
settings.snow.amount.few=小雪
settings.snow.amount.normal=中雪
settings.snow.amount.many=大雪
settings.snow.speed.slow=缓慢飘落
settings.snow.speed.normal=正常飘落
settings.snow.speed.fast=快速飘落
settings.snow.frame.rate.low={0} fps，省电
settings.snow.frame.rate.medium={0} fps
settings.snow.frame.rate.high={0} fps，流畅
settings.snow.comment=在下方开启的位置下雪，也会落在代码上方。编辑器右上角和面板标题栏中的按钮依次切换：彩灯灯泡表示全部关闭，雪花表示只下雪，然后是雪和场景，最后是星空下的场景。
settings.scenes.group=场景
settings.place.editor=编辑器：
settings.place.panels=Project 和 Commit：
settings.place.bottom=底部工具窗口：
settings.place.right=右侧工具窗口：
settings.place.snow=雪
settings.village.enabled=村庄
settings.village.comment=沿编辑器底部显示，位于代码上方。细节每天都会变化；傍晚窗户和路灯会亮起。点击房子可以生起炉火。
settings.village.style.hill_farm=山丘上的农庄
settings.village.style.valley=带滑雪坡的山谷
settings.village.style.uphill_street=上坡的街道
settings.village.style.forest_clearing=林间空地
settings.village.style.random=每天随机
settings.residents.enabled=居民
settings.residents.comment=时不时上演小场景：猫、红腹灰雀、狗、唱颂歌的人，每种风格还有各自独有的场景。
settings.residents.frequency.rare=较少
settings.residents.frequency.normal=正常
settings.residents.frequency.often=频繁
settings.drift.enabled=雪人
settings.drift.comment=需要 Islands UI。Project 面板底部的雪堆和雪人；树很长时会遮住最后几行。
settings.railway.enabled=铁路
settings.railway.comment=显示在 Terminal、Run、Debug、Git 等底部窗口下方的一条场景带。高度小于 120 像素的窗口中不显示。
settings.railway.frequency=火车：
settings.railway.frequency.rare=较少
settings.railway.frequency.normal=正常
settings.railway.frequency.often=频繁
settings.railway.residents=行人
settings.railway.poles=电线杆和小鸟
settings.yard.enabled=圣诞老人的院子
settings.yard.comment=需要 Islands UI。显示在 Gradle、Maven、Database 等右侧窗口下方的一条场景带：工坊、雪橇、雪人、邮箱。高度小于 120 像素的窗口中不显示。
settings.yard.reactions=响应运行
settings.yard.reactions.comment=运行期间，小精灵们把礼物搬上雪橇。成功时圣诞老人驾着雪橇离开，失败时一个礼物炸成彩色纸屑。
settings.yard.letters=信件
settings.yard.letters.comment=每来一条通知，红腹灰雀就送来一封信。邮袋每天清空一次。
settings.buttons=标题栏按钮：
settings.buttons.bottom=底部窗口
settings.buttons.right=右侧窗口
settings.buttons.comment=实验性：依赖 IDE 构建工具窗口标题栏的方式。“⋮”菜单左侧的按钮可依次切换雪和场景。
settings.window.group=IDE 窗口
settings.garland=彩灯：
settings.garland.enabled=面板之间
settings.garland.comment=需要 Islands UI。彩灯挂在面板之间的缝隙中和状态栏上方。
settings.garland.mode.twinkle=闪烁
settings.garland.mode.chase=追逐
settings.garland.mode.flow=流光
settings.garland.mode.warm_white=暖白
settings.icicles=冰柱：
settings.icicles.enabled=工具栏下方
settings.icicles.comment=需要 Islands UI。冰柱尖端偶尔会闪光。
settings.tabicicles.enabled=活动标签页下方
settings.tabicicles.comment=实验性：依赖编辑器标签页的布局方式。仅适用于编辑器上方的标签页。
settings.caps=积雪边缘：
settings.popups.enabled=弹出窗口上
settings.popups.comment=实验性。显示在 Search Everywhere、Go to 等弹出窗口的上边缘；通知的角上有一枝冬青。
settings.menus.enabled=上下文菜单上
settings.menus.comment=实验性。显示在上下文菜单和子菜单上方；菜单项保持不变。
settings.runs=运行和构建：
settings.run.reactions.enabled=彩灯和冰柱做出反应
settings.run.reactions.comment=当运行、测试或构建自行结束（未按 Stop）时：成功时彩灯变成金色，失败时灯光闪红，冰柱沿窗口落下，随后重新长出。
settings.fireworks.enabled=烟花
settings.fireworks.comment=实验性：依赖主工具栏的布局方式。成功时在工具栏按钮之间最多绽放三朵烟花。
